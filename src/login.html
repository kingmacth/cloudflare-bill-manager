<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 账单管家</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#080d18;color:#e5e7eb;font-family:system-ui}input{color-scheme:dark}</style></head><body class="min-h-screen flex items-center justify-center p-6"><main class="w-full max-w-sm rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl"><div class="text-emerald-400 text-sm tracking-widest mb-5">PERSONAL FINANCE</div><h1 class="text-3xl font-semibold">账单管家</h1><p class="text-slate-400 mt-3 mb-8">你的账单，安全有序。</p><form id="form"><label for="password" class="block text-sm mb-2">访问密码</label><input id="password" type="password" required maxlength="512" autocomplete="current-password" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl focus:outline-emerald-400"><button class="w-full bg-emerald-400 text-slate-950 font-semibold p-3 rounded-xl mt-5">安全登录</button><p id="error" role="alert" class="text-rose-400 text-sm mt-4"></p></form><p class="text-xs text-slate-500 mt-8">私密空间 · 登录有效期 12 小时</p></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.reload()}catch(e){document.querySelector('#error').textContent=e.message||'连接失败'}finally{b.disabled=false}})</script></body></html>
