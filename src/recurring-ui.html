<section class="mt-9"><div class="flex justify-between items-center gap-3"><div><h2 class="text-xl font-semibold">周期账单</h2><p class="muted text-sm mt-2">房贷、租金及其他固定周期还款</p></div><button id="addRecurring" class="bg-emerald-400 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm">+ 添加周期账单</button></div><p id="scheduleNotice" role="status" aria-live="polite" class="text-sm text-emerald-300 mt-3"></p><div id="scheduleList" class="grid gap-4 mt-4"><p class="muted text-sm">正在加载…</p></div><p class="text-xs muted mt-3">按设置金额生成未来 35 天内的账单；实际扣款以银行为准。暂停只停止后续生成，已有账单继续保留；恢复时会补齐暂停期间应到期的账单。</p></section>
<dialog id="recurringDialog" class="panel text-slate-200 p-6 w-full max-w-lg max-h-[90vh] overflow-auto"><form id="recurringForm"><h2 class="text-xl mb-5">添加周期账单</h2><div class="grid sm:grid-cols-2 gap-3"><label class="text-sm">账单名称<input name="name" required maxlength="80" placeholder="例如：住房贷款" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="text-sm">类型<select name="category" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"><option value="mortgage">房贷</option><option value="recurring">其他周期账单</option></select></label><label class="text-sm">贷款银行 / 机构<input name="institution" maxlength="80" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="text-sm">贷款人 / 客户姓名<input name="customer_name" maxlength="60" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="text-sm">扣款银行卡后四位<input name="card_last4" pattern="[0-9]{4}" maxlength="4" inputmode="numeric" placeholder="1234" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="text-sm">每期金额（人民币）<input name="amount" required type="number" min="0" max="10000000000" step="0.01" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="text-sm">周期（月）<input name="interval_months" required type="number" min="1" max="120" value="1" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"><span class="muted text-xs">1 = 每月，3 = 每季度，12 = 每年</span></label><label class="text-sm">每期还款日<input name="due_day" required type="number" min="1" max="31" value="20" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"><span class="muted text-xs">当月没有该日时使用月末</span></label><label class="text-sm">开始计账日期<input name="start_date" required type="date" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"><span class="muted text-xs">可填下一期开始日期，避免生成历史欠款</span></label><label class="text-sm">结束日期（可选）<input name="end_date" type="date" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label></div><p class="text-xs muted mt-4">只需银行卡后四位，无需完整卡号。金额按设置记录，不自动计算利率、提前还款或银行扣款。</p><p id="recurringError" role="alert" class="text-rose-400 text-sm mt-3"></p><div class="flex gap-3 mt-5"><button class="bg-emerald-400 text-slate-950 px-4 py-2 rounded-lg font-semibold">保存并生成账单</button><button id="closeRecurring" type="button" class="border border-slate-600 px-4 py-2 rounded-lg">取消</button></div></form></dialog>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const dialog=document.querySelector('#recurringDialog'),form=document.querySelector('#recurringForm'),list=document.querySelector('#scheduleList');let schedules=[];
 async function schedulesLoad(){try{const data=await api('/api/recurring');schedules=data.schedules;list.innerHTML=schedules.length?schedules.map(s=>`<article class="panel p-5"><div class="flex justify-between gap-3"><div><h3 class="font-semibold">${esc(s.name)} <span class="text-xs ${s.is_active?'text-emerald-300':'muted'}">${s.is_active?'启用中':'已暂停'}</span></h3><p class="muted text-sm mt-2">${esc(s.institution||'未填写机构')} · 每 ${s.interval_months} 个月 ${s.due_day} 日</p>${identityLine(s)}<p class="muted text-xs mt-2">开始 ${esc(s.start_date)}${s.end_date?' · 结束 '+esc(s.end_date):''}</p></div><button data-toggle-schedule="${s.id}" class="border border-slate-600 rounded-lg px-3 py-1 text-sm self-start">${s.is_active?'暂停生成':'恢复生成'}</button></div><div class="flex flex-wrap items-center gap-3 mt-4"><label class="text-sm muted">每期金额 <input aria-label="每期金额" data-schedule-amount="${s.id}" type="number" min="0" max="10000000000" step="0.01" value="${s.amount.toFixed(2)}" class="bg-slate-950 text-slate-100 p-2 rounded-lg w-36"></label><button data-save-amount="${s.id}" class="bg-emerald-400 text-slate-950 font-semibold px-3 py-2 rounded-lg text-sm">保存新金额</button></div><p class="text-xs muted mt-2">更新金额同步到今天及以后未还的本周期账单；已还记录和历史到期账单保留。</p></article>`).join(''):'<p class="muted text-sm">还没有周期账单，点击上方按钮添加房贷。</p>'}catch(e){list.textContent=e.message}}
 document.querySelector('#addRecurring').onclick=()=>{form.reset();form.elements.start_date.value=today||new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());document.querySelector('#recurringError').textContent='';dialog.showModal()};document.querySelector('#closeRecurring').onclick=()=>dialog.close();
 form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const data=Object.fromEntries(new FormData(form));for(const key of ['amount','interval_months','due_day'])data[key]=Number(data[key]);await api('/api/recurring',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});dialog.close();await Promise.all([load(),schedulesLoad()])}catch(e){document.querySelector('#recurringError').textContent=e.message}finally{button.disabled=false}};
 list.addEventListener('click',async e=>{const button=e.target.closest('[data-toggle-schedule],[data-save-amount]');if(!button)return;button.disabled=true;try{const id=Number(button.dataset.toggleSchedule||button.dataset.saveAmount);const s=schedules.find(s=>s.id===id);const amountInput=list.querySelector('[data-schedule-amount="'+id+'"]');if(button.dataset.saveAmount&&(!amountInput.value.trim()||!amountInput.checkValidity()))throw Error('请填写有效的每期金额，最多保留两位小数');const body=button.dataset.toggleSchedule?{is_active:s.is_active?0:1}:{amount:Number(amountInput.value)};await api('/api/recurring/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await Promise.all([load(),schedulesLoad()]);document.querySelector('#error').textContent='';const message=document.querySelector('#scheduleNotice');message.textContent=button.dataset.saveAmount?'金额已保存，今天及以后未还账单已同步更新。':'周期账单状态已保存。'}catch(e){document.querySelector('#error').textContent=e.message}finally{button.disabled=false}});schedulesLoad();
});
</script>
