<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账单管家</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#080d18;color:#e2e8f0;font-family:system-ui}input{color-scheme:dark}summary{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.panel{border:1px solid #233044;background:#111a2b;border-radius:20px}.muted{color:#94a3b8}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible{outline:2px solid #34d399;outline-offset:4px}dialog::backdrop{background:#000a}</style></head>
<body><main class="max-w-5xl mx-auto px-5 py-8 sm:py-12"><header class="flex justify-between items-center gap-3"><div><p class="text-xs tracking-widest text-emerald-400 mb-2">PERSONAL FINANCE / 私人账本</p><h1 class="text-3xl font-semibold">账单管家<span class="text-emerald-400">.</span></h1><p id="today" class="muted text-sm mt-2"></p></div><button id="logout" class="border border-slate-700 px-4 py-2 rounded-xl text-sm">退出登录</button></header>
<section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-9"><div class="panel p-6"><p class="muted text-sm">本月待还总额</p><p id="month" class="text-3xl font-semibold mt-3">—</p></div><div class="panel p-6"><p class="muted text-sm">不足 3 天临期 + 逾期</p><p id="soon" class="text-3xl font-semibold mt-3 text-orange-300">—</p></div><div class="panel p-6"><p class="muted text-sm">本月已还清</p><p id="paid" class="text-3xl font-semibold mt-3 text-emerald-300">—</p></div></section>
<p class="text-xs muted mt-3">统计按还款日期所属月份计算；币种：人民币。标记已还仅记录状态，请通过银行完成实际还款。</p>
<section id="annual" class="hidden mt-6 panel p-5 border-amber-600"></section>
<section class="mt-9"><div class="flex flex-wrap gap-3 justify-between items-center"><h2 class="text-xl font-semibold">我的账单 <span id="count" class="muted text-sm"></span></h2><div class="flex gap-2 text-sm" id="filters"><button data-filter="unpaid" class="px-3 py-2 rounded-lg">待还款</button><button data-filter="paid" class="px-3 py-2 rounded-lg">已还款</button><button data-filter="all" class="px-3 py-2 rounded-lg">全部</button><button id="refresh" class="px-3 py-2 rounded-lg border border-slate-700">刷新</button></div></div><p id="error" role="alert" class="text-rose-400 mt-4"></p><div id="list" class="grid gap-4 mt-5"><p class="muted py-8">正在加载账单…</p></div></section>
<section class="mt-9"><h2 class="text-xl font-semibold">待人工确认邮件</h2><p class="muted text-sm mt-2">未完整识别的账单和 PDF 在此核对补录。</p><div class="flex flex-wrap items-center gap-3 mt-4"><button id="importEmail" class="border border-slate-600 px-3 py-2 rounded-lg text-sm">导入 .eml 邮件</button><input id="emailFile" type="file" accept=".eml,message/rfc822" hidden><span class="text-xs muted">邮箱下载的原始邮件，最大 20MB</span></div><p id="reviewNotice" role="status" aria-live="polite" class="text-sm text-emerald-300 whitespace-pre-wrap mt-3"></p><div id="review" class="grid gap-4 mt-4"></div></section>
<!--RECURRING--><footer class="text-xs muted mt-12 border-t border-slate-800 pt-6">每日 09:00（北京时间）检查 · 不足 3 天时每日汇总提醒一次 · 年费信息请结合银行原始账单核实</footer></main>
<dialog id="resolve" class="panel text-slate-200 p-6 w-full max-w-md"><form id="resolveForm"><h2 class="text-xl mb-4">确认账单</h2><input type="hidden" name="email"><label class="block text-sm mb-3">客户姓名<input name="customer_name" maxlength="60" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="block text-sm mb-3">银行卡后四位<input name="card_last4" maxlength="64" placeholder="1234，多张卡用英文逗号分隔" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="block text-sm mb-3">银行名称<input name="bank" required maxlength="50" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="block text-sm mb-3">全额应还总额（人民币）<input name="amount" required type="number" min="0" max="10000000000" step="0.01" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="block text-sm mb-3">到期还款日<input name="due_date" required type="date" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="block text-sm mb-3">账单日期<input name="statement_date" type="date" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></label><label class="block text-sm mb-3">年费相关信息<textarea name="annual_fee_info" maxlength="12000" class="block w-full p-2 mt-1 bg-slate-950 rounded-lg"></textarea></label><p id="formError" class="text-rose-400 text-sm"></p><div class="flex gap-3 mt-5"><button class="bg-emerald-400 text-slate-950 px-4 py-2 rounded-lg">保存</button><button type="button" id="cancel" class="px-4 py-2 border border-slate-600 rounded-lg">取消</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(n), diff=(a,b)=>Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);
let bills=[],today='',filter='unpaid',reviewEmails=new Map();
function identityLine(b){return '<p class="text-xs muted mt-2">客户：'+esc(b.customer_name||'未识别')+' · 卡尾号：'+esc(b.card_last4||'未识别')+'</p>'}
async function api(path,options={}){const r=await fetch(path,{...options,signal:options.signal||AbortSignal.timeout(45000)});if(r.status===401){location.reload();throw Error('登录已过期')}const d=await r.json();if(!r.ok){const error=Error(d.error||'操作失败');error.code=d.code;throw error}return d}
function render(){const month=bills.filter(b=>b.due_date.slice(0,7)===today.slice(0,7));$('#month').textContent=money(month.filter(b=>!b.is_paid).reduce((s,b)=>s+b.amount,0));$('#paid').textContent=money(month.filter(b=>b.is_paid).reduce((s,b)=>s+b.amount,0));$('#soon').textContent=money(bills.filter(b=>!b.is_paid&&diff(b.due_date,today)<3).reduce((s,b)=>s+b.amount,0));$('#today').textContent=today+' · 北京时间';const selected=bills.filter(b=>filter==='all'||(b.is_paid===(filter==='paid'?1:0)&&(filter!=='unpaid'||b.amount>0)));$('#count').textContent=selected.length+' 笔';$('#filters').querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('bg-emerald-400',b.dataset.filter===filter);b.classList.toggle('text-slate-950',b.dataset.filter===filter)});
const annual=bills.filter(b=>b.annual_fee_info&&!b.is_paid);$('#annual').classList.toggle('hidden',!annual.length);$('#annual').innerHTML='<h2 class="text-amber-300 font-semibold">⚠ 年费特别提示</h2>'+annual.map(b=>'<p class="text-sm mt-2 whitespace-pre-wrap">'+esc(b.bank)+' · '+esc(b.annual_fee_info)+'</p>').join('');
$('#list').innerHTML=selected.length?selected.map(b=>{const days=diff(b.due_date,today),label=b.amount===0?'无需还款':b.is_paid?'已还清':days<0?'逾期 '+(-days)+' 天':days===0?'今日到期':'剩余 '+days+' 天',color=b.amount===0||b.is_paid?'text-emerald-300 bg-emerald-950':days<0?'text-rose-300 bg-rose-950':days<3?'text-orange-300 bg-orange-950':'text-emerald-300 bg-emerald-950';return `<article class="panel p-5 sm:p-6"><div class="flex justify-between items-start gap-3"><div><h3 class="text-lg font-semibold">${esc(b.bank)}</h3>${identityLine(b)}<p class="muted text-xs mt-2">${b.category==='credit_card'?'账单日期 '+esc(b.statement_date||'未识别'):'周期生成'} · 还款日 ${esc(b.due_date)}</p></div><span class="text-xs rounded-full px-3 py-1 whitespace-nowrap ${color}">${label}</span></div><div class="flex flex-wrap items-end justify-between gap-4 mt-6"><div><p class="text-xs muted">全额应还 / 账单总额</p><p class="text-3xl font-semibold mt-1">${money(b.amount)}</p>${b.minimum_amount!==null?`<p class="text-xs muted mt-2">最低还款额 ${money(b.minimum_amount)}</p>`:''}</div><div class="flex gap-2">${b.pdf_count?`<a target="_blank" rel="noopener" href="/api/bills/${b.id}/pdf" class="text-sm border border-slate-600 p-2 rounded-lg">查看 PDF</a>`:''}<button data-pay="${b.id}" data-paid="${b.is_paid}" class="text-sm p-2 rounded-lg ${b.is_paid?'border border-slate-600':'bg-emerald-400 text-slate-950 font-semibold'}">${b.is_paid?'撤销还款':'标记已还'}</button></div></div>${b.annual_fee_info?`<p class="text-amber-300 text-sm whitespace-pre-wrap mt-5">⚠ ${esc(b.annual_fee_info)}</p>`:''}<details class="mt-5 text-sm"><summary class="muted">账单明细 · ${b.details.length} 条</summary>${b.details.length?`<div class="overflow-auto mt-3"><table class="w-full text-sm"><thead><tr class="text-left muted"><th class="py-2">日期</th><th>交易说明</th><th class="text-right">金额</th></tr></thead><tbody>${b.details.map(t=>`<tr class="border-t border-slate-800"><td class="py-3 whitespace-nowrap">${esc(t.date)}</td><td class="px-3">${esc(t.description)}</td><td class="text-right">${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted mt-3">未识别到结构化明细，请查看原始 PDF 或银行邮件。</p>'}<p class="text-xs muted mt-2">自动提取结果以银行原账单为准。</p></details><details data-logs="${b.id}" class="mt-4 text-sm"><summary class="muted">还款操作日志</summary><div class="mt-3 muted">展开加载日志…</div></details><p class="text-xs text-slate-500 mt-5 truncate" title="${esc(b.subject)}">${esc(b.subject)}</p></article>`}).join(''):'<div class="panel p-10 text-center"><p class="text-lg">'+(filter==='unpaid'?'暂无待还账单':'暂无账单')+'</p><p class="muted text-sm mt-2">转发银行账单至你配置的收件邮箱，或导入 .eml 原始邮件</p></div>'}
async function load(){try{$('#error').textContent='';const [d,r]=await Promise.all([api('/api/bills'),api('/api/review')]);bills=d.bills;today=d.today;render();const grouped=new Map();for(const e of r.emails){if(!grouped.has(e.id))grouped.set(e.id,{...e,attachments:[]});if(e.attachment_id)grouped.get(e.id).attachments.push({id:e.attachment_id,name:e.filename})}reviewEmails=grouped;$('#review').innerHTML=[...grouped.values()].map(e=>`<article class="panel p-5"><h3 class="font-semibold">${esc(e.subject)}</h3><p class="text-sm muted mt-2">${esc(e.sender)}</p><p class="text-xs muted mt-2">收件时间：${esc(new Date(e.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))}（北京时间）</p>${identityLine(JSON.parse(e.extracted_json||'{}'))}<p class="text-sm text-orange-300 mt-2">${esc(e.reason||'邮件处理中，请稍后刷新')}</p>${JSON.parse(e.extracted_json||'{}').annual_fee_info?`<p class="text-amber-300 text-sm whitespace-pre-wrap mt-3">⚠ 年费相关（待核对）：${esc(JSON.parse(e.extracted_json).annual_fee_info)}</p>`:''}<div class="flex gap-3 flex-wrap mt-4"><button data-reprocess="${e.id}" class="text-sm border border-slate-600 px-3 py-1 rounded-lg">重新解析</button>${e.attachments.map(a=>`<a href="/api/attachments/${a.id}" target="_blank" rel="noopener" class="text-sm text-emerald-300">${esc(a.name)}</a>`).join('')}<button data-resolve="${e.id}" data-bank="${esc(e.bank||'')}" class="text-sm border border-slate-600 px-3 py-1 rounded-lg">补录账单</button></div><p data-reprocess-result="${e.id}" role="status" aria-live="polite" class="text-sm mt-3 whitespace-pre-wrap"></p></article>`).join('')||'<p class="muted text-sm">没有待确认邮件</p>'}catch(e){$('#error').textContent=e.message}}
$('#filters').addEventListener('click',e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;render()}});$('#refresh').onclick=load;
$('#list').addEventListener('click',async e=>{const b=e.target.closest('[data-pay]');if(!b)return;b.disabled=true;try{await api('/api/bills/'+b.dataset.pay+'/'+(b.dataset.paid==='1'?'unpay':'pay'),{method:'POST'});await load()}catch(e){$('#error').textContent=e.message}finally{b.disabled=false}});
$('#list').addEventListener('toggle',async e=>{const d=e.target;if(!d.open||!d.dataset.logs)return;try{const r=await api('/api/bills/'+d.dataset.logs+'/logs');d.querySelector('div').innerHTML=r.logs.length?r.logs.map(l=>'<p class="mb-2">'+esc(new Date(l.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))+' · '+(l.action==='pay'?'标记已还':'撤销还款')+'</p>').join(''):'暂无还款操作'}catch(e){d.querySelector('div').textContent=e.message}},true);
$('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'});location.reload()}catch(e){$('#error').textContent=e.message}};
$('#review').addEventListener('click',async e=>{const retry=e.target.closest('[data-reprocess]');if(retry){retry.disabled=true;retry.textContent='正在解析…';const id=retry.dataset.reprocess,result=retry.closest('article').querySelector('[data-reprocess-result]');result.textContent='正在读取邮件原文并解析，请稍候…';let missing=false;try{const data=await api('/api/emails/'+id+'/reprocess',{method:'POST'});await load();const notice=$('#reviewNotice');notice.textContent=data.message;notice.className='text-sm whitespace-pre-wrap mt-3 '+(data.status==='parsed'?'text-emerald-300':'text-orange-300');const current=$('#review').querySelector('[data-reprocess-result="'+id+'"]');if(current){current.textContent=data.message;current.className='text-sm text-orange-300 mt-3 whitespace-pre-wrap'}}catch(error){missing=error.code==='SOURCE_MISSING';result.textContent=error.name==='TimeoutError'?'请求超时，请刷新查看处理结果后再试。':error.message;result.className='text-sm text-rose-400 mt-3 whitespace-pre-wrap';result.scrollIntoView({block:'nearest',behavior:'smooth'})}finally{retry.disabled=missing;retry.textContent=missing?'缺少原文':'重新解析'}return}const b=e.target.closest('[data-resolve]');if(!b)return;const f=$('#resolveForm');f.reset();f.elements.email.value=b.dataset.resolve;const parsed=JSON.parse(reviewEmails.get(b.dataset.resolve)?.extracted_json||'{}');f.elements.bank.value=b.dataset.bank;f.elements.customer_name.value=parsed.customer_name||'';f.elements.card_last4.value=parsed.card_last4||'';f.elements.amount.value=parsed.amount??'';f.elements.due_date.value=parsed.due_date||'';f.elements.statement_date.value=parsed.statement_date||'';f.elements.annual_fee_info.value=parsed.annual_fee_info||'';$('#formError').textContent='';$('#resolve').showModal()});$('#cancel').onclick=()=>$('#resolve').close();$('#resolveForm').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(f));data.amount=Number(data.amount);await api('/api/review/'+data.email+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});$('#resolve').close();await load()}catch(e){$('#formError').textContent=e.message}finally{b.disabled=false}};
$('#importEmail').onclick=()=>$('#emailFile').click();$('#emailFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const button=$('#importEmail'),notice=$('#reviewNotice');if(file.size>20*1024*1024){notice.textContent='邮件超过 20MB，请选择较小的原始邮件';notice.className='text-sm text-rose-400 mt-3';return}button.disabled=true;button.textContent='正在导入…';notice.textContent='正在上传并解析原始邮件…';try{const result=await api('/api/emails/import',{method:'POST',headers:{'Content-Type':'message/rfc822'},body:file});await load();notice.textContent=result.message;notice.className='text-sm whitespace-pre-wrap mt-3 '+(result.status==='parsed'?'text-emerald-300':'text-orange-300')}catch(error){notice.textContent=error.name==='TimeoutError'?'导入请求超时，请刷新查看结果后再试。':error.message;notice.className='text-sm text-rose-400 mt-3'}finally{button.disabled=false;button.textContent='导入 .eml 邮件';e.target.value=''}};load();
</script></body></html>
